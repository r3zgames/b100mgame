<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>B100M</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #05050d;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<meta name="description" content="B100M: neon flowers bloom through a machine world. A music-driven puzzle battle by R3Z Games. Free public beta."><meta name="theme-color" content="#05060c"><style>html,body{background:#05060c;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{touch-action:none}#status{background:#05060c!important}#status-progress{display:none!important}#status-notice{color:#9fb0d8;font-family:system-ui,sans-serif}#grow{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}#grow svg{width:min(42vw,220px);height:auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(77,255,176,.55)) drop-shadow(0 0 18px rgba(176,123,255,.35))}#grow .stem{fill:none;stroke:#4dffb0;stroke-width:3;stroke-linecap:round}#grow .leaf{fill:rgba(77,255,176,.12);stroke:#4dffb0;stroke-width:2;opacity:0;transform-box:fill-box;transform:scale(.2);transition:opacity .5s,transform .6s cubic-bezier(.2,1.6,.4,1)}#grow .leaf.on{opacity:1;transform:scale(1)}#grow .bloom path{fill:rgba(255,79,140,.14);stroke:#ff4f8c;stroke-width:2.4}#grow .bloom{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.1) rotate(-40deg);transition:opacity .6s,transform .9s cubic-bezier(.2,1.5,.4,1)}#grow .bloom.on{opacity:1;transform:scale(1) rotate(0)}#grow .seed{fill:#eef3ff}#grow-label{color:#9fb0d8;font:500 14px system-ui,sans-serif;letter-spacing:.08em}@media (prefers-reduced-motion:reduce){#grow .leaf,#grow .bloom{transition:none}}</style><!-- The loading bar grows like a plant: the stem draws up with the download, leaves unfold on the way, a flower blooms when the game is ready. No // comments in the script: it is folded onto one line. --><script>(function(){  var vp=document.querySelector('meta[name=viewport]'); if(vp&&vp.content.indexOf('viewport-fit')<0) vp.content+=', viewport-fit=cover';  function build(){    var status=document.getElementById('status'); if(!status||document.getElementById('grow'))return;    var wrap=document.createElement('div'); wrap.id='grow';    wrap.innerHTML='<svg viewBox="0 0 120 220" aria-hidden="true">'      +'<path class="stem" id="grow-stem" d="M60 214 C58 180 70 160 60 130 C50 100 66 80 60 52"/>'      +'<path class="leaf" data-at="0.2" d="M61 186 Q84 176 92 160 Q72 162 61 186Z"/>'      +'<path class="leaf" data-at="0.4" d="M59 150 Q34 142 26 124 Q48 126 59 150Z"/>'      +'<path class="leaf" data-at="0.6" d="M61 112 Q86 104 92 86 Q72 90 61 112Z"/>'      +'<path class="leaf" data-at="0.8" d="M60 80 Q38 72 32 56 Q52 60 60 80Z"/>'      +'<g class="bloom" id="grow-bloom">'      +[0,72,144,216,288].map(function(a){return '<path transform="rotate('+a+' 60 40)" d="M60 40 C46 26 50 8 60 8 C70 8 74 26 60 40Z"/>';}).join('')      +'<circle class="seed" cx="60" cy="40" r="4"/></g></svg>'      +'<div id="grow-label" role="status">GROWING</div>';    status.appendChild(wrap);    var stem=document.getElementById('grow-stem'), len=stem.getTotalLength();    stem.style.strokeDasharray=len; stem.style.strokeDashoffset=len;    var bar=document.getElementById('status-progress'), leaves=wrap.querySelectorAll('.leaf'), bloom=document.getElementById('grow-bloom'), label=document.getElementById('grow-label');    var shown=0;    function tick(){      var p=0; if(bar&&bar.max>0)p=Math.min(1,bar.value/bar.max);      shown+= (p-shown)*0.15;      stem.style.strokeDashoffset=len*(1-shown);      leaves.forEach(function(l){ if(shown>=+l.dataset.at) l.classList.add('on'); });      if(shown>0.97){ bloom.classList.add('on'); label.textContent='BLOOM'; }      if(status.style.display!=='none' && getComputedStyle(status).visibility!=='hidden') requestAnimationFrame(tick);    }    requestAnimationFrame(tick);  }  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build); else build();})();</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15157028,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
